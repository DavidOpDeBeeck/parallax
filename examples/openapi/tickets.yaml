openapi: 3.0.3
info:
  title: Tickets
  version: 1.1.0
paths:
  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment"
      responses:
        "201":
          description: The comment, as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
components:
  schemas:
    Ticket:
      type: object
      required: [id]
      properties:
        id:
          type: string
        priority:
          type: string
          enum: [low, normal, high]
        state:
          type: string
          enum: [open, closed, archived]
    Comment:
      type: object
      required: [body]
      properties:
        id:
          type: string
        body:
          type: string
